<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sable Harbour Job Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sable Harbour Job Board</h1>
        
        <div id="character-bar">
            <label for="char-select">Playing as:</label>
            <select id="char-select" onchange="switchCharacter(this.value)">
                <option value="Arendale">Arendale</option>
                <option value="Edrin">Edrin</option>
                <option value="Kaarn">Kaarn</option>
                <option value="Kurtz">Kurtz</option>
                <option value="NEW">+ Add New Character</option>
            </select>
            <button onclick="toggleDmMode()" id="dm-toggle-btn">DM Mode</button>
        </div>
    </header>

    <!-- DM Panel for Posting New Quests -->
    <section id="dm-add-job-panel" style="display: none;" class="dm-panel">
        <h2>DM Panel: Post New Quest Notice</h2>
        <div class="form-grid">
            <input type="text" id="new-job-title" placeholder="Quest Title (e.g. WORM SIGN)" />
            <input type="text" id="new-job-offered" placeholder="Offered By (e.g. Fangtide Brotherhood)" />
            <input type="text" id="new-job-reward" placeholder="Reward (e.g. 2,000 gp)" />
            <textarea id="new-job-desc" placeholder="Quest Description..."></textarea>
            <button onclick="createNewJob()" class="btn-post">Post Quest to Board</button>
        </div>
    </section>

<!-- Quest Filter Bar -->
<div id="filter-bar" class="filter-container">
    <button onclick="setFilter('ALL')" class="filter-btn active">ALL CONTRACTS</button>
    <button onclick="setFilter('ACCEPTED')" class="filter-btn">ACCEPTED</button>
    <button onclick="setFilter('AVAILABLE')" class="filter-btn">OPEN BOUNTIES</button>
    <button onclick="setFilter('UNVOTED')" class="filter-btn">NEEDS YOUR MARK</button>
</div>

    <main id="board-container">
        <!-- Job cards render live from Firebase here -->
    </main>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
