<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventurer's Guild Job Board</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4e9d8;
            color: #2b1d0c;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #8b5a2b;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .job-card {
            background-color: #fffdf5;
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        .reward {
            font-weight: bold;
            color: #b8860b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Notice Board of the Golden Griffin</h1>
        <p>Contracts, Bounties, and Quests for Adventurers</p>
    </header>

    <main>
        <div class="job-card">
            <h2>Cellar Pest Control</h2>
            <p><strong>Posted By:</strong> Toblen Stonehill (Innkeeper)</p>
            <p>Strange rustling noises coming from the basement food stores. Need someone to clear out whatever is eating the grain.</p>
            <p class="reward">Reward: 15 GP + Free Round of Ale</p>
        </div>
    </main>

</body>
</html>
